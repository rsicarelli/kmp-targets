# The committed, full selection — the lane that OWNS every target's ABI, so apiDump/apiCheck and the
# committed api/ dumps cover all three targets. The blind spot is demonstrated by overriding this on
# the command line with a narrowed lane, e.g. `-Pkmptargets.targets=jvm` (see README).
kmptargets.targets=jvm,linuxX64,js

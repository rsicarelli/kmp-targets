org.gradle.caching=true
# Config cache is left OFF for this sample: AGP + KSP + ktorfit on Gradle 9 can be noisy with it, and
# the point here is a clean read on whether the Android-only target wires up — not config-cache perf.
org.gradle.configuration-cache=false
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# AGP 9.0+ refuses the classic `com.android.library` + `org.jetbrains.kotlin.multiplatform` combo.
# kmp-targets registers Android via KGP's classic `androidTarget()`, which needs the classic plugin,
# so we opt out of AGP's built-in Kotlin / new DSL to keep that path working.
android.builtInKotlin=false
android.newDsl=false

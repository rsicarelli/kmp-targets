# Global selection — intersected against each module's `supports { … }`.
# Both Android and JVM are offered so the control module can register two targets; the android-only
# module still registers Android only (its `supports { androidTarget }` is the narrower set).
kmptargets.targets=androidTarget,jvm

# Stable umbrella lifecycle tasks (kmpCompileAll / kmpTestAll) across the selection.
kmptargets.umbrellaTasks=true

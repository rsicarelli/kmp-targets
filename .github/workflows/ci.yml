name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, sample
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check (compile + test)
        run: ./gradlew check

      - name: Publish plugins to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Build sample (hello-world)
        run: ./gradlew -p samples/hello-world build

      - name: Build sample (isolated-projects, Isolated Projects enabled)
        run: ./gradlew -p samples/isolated-projects build

      # ABI × selection blind spot (#81): under a narrowed jvm lane the committed dumps cover
      # targets the build did not register, so kmpTargetsDoctor flags it. Doctor compiles nothing,
      # so this stays on the fast lane (no Kotlin/Native toolchain). The -P flag is quoted for
      # PowerShell parity with the sample matrix; harmless on bash.
      - name: ABI coverage signal (kotlinx BCV sample)
        run: ./gradlew -p samples/abi-bcv kmpTargetsDoctor "-Pkmptargets.targets=jvm"

      - name: ABI coverage signal (built-in abiValidation sample)
        run: ./gradlew -p samples/abi-builtin kmpTargetsDoctor "-Pkmptargets.targets=jvm"

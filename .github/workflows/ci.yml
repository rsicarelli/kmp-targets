name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, sample
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 23
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check (compile + test)
        run: ./gradlew check

      - name: Publish plugins to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Build sample (hello-world)
        run: ./gradlew -p samples/hello-world build

      - name: Build sample (isolated-projects, Isolated Projects enabled)
        run: ./gradlew -p samples/isolated-projects build

      # ABI × selection blind spot (#81): a real ABI tool run under a narrowed jvm lane. The built-in
      # checkKotlinAbi passes green while silently not validating js/linuxX64 — the false-green — and
      # the kmp-targets hook warns about exactly that. jvm-only, so no Kotlin/Native toolchain is
      # needed and this stays on the fast lane. The -P flag is quoted for PowerShell parity with the
      # sample matrix; harmless on bash.
      - name: ABI narrowing signal (built-in abiValidation sample)
        run: ./gradlew -p samples/abi-builtin checkKotlinAbi "-Pkmptargets.targets=jvm"

      # The BCV sample applies a third-party plugin — prove it configures cleanly with kmp-targets on
      # the fast lane (its real apiCheck under the full selection needs the Native toolchain; run it
      # via `task sample:abi-bcv`).
      - name: ABI sample configures (kotlinx BCV sample)
        run: ./gradlew -p samples/abi-bcv kmpTargetsInfo "-Pkmptargets.targets=jvm"

  docs:
    name: Docs (strict build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install MkDocs dependencies
        run: pip install --requirement .github/workflows/mkdocs-requirements.txt

      - name: Build docs (strict)
        run: mkdocs build --strict

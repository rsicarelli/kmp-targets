name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement, triage]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem are you trying to solve? What's the use case?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behavior
      description: |
        If applicable, sketch the property syntax, plugin DSL, or task surface you'd want.
      placeholder: |
        KMP_TARGETS=android,iosAll,wasm
        # or
        kmpTargets {
            require("android")
            allow("ios")
        }

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about (or rejected, and why).

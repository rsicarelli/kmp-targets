version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      junit:
        patterns:
          - "org.junit*"
    ignore:
      # Kotlin is upgraded deliberately (toolchain + sample DSL migration), never as an automated
      # bump — Kotlin 2.4.0 removed the built-in ABI-validation DSL the abi-builtin sample uses (#92).
      - dependency-name: "org.jetbrains.kotlin*"
      # Compose is upgraded deliberately in lockstep with the Kotlin / Compose-compiler toolchain.
      - dependency-name: "org.jetbrains.compose*"
      - dependency-name: "androidx.compose*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      actions:
        patterns:
          - "*"

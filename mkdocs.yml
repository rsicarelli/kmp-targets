# kmp-targets Documentation Site
# To serve locally: task docs:serve
# Deployed by .github/workflows/deploy-docs.yml (mike, versioned on gh-pages)

site_name: kmp-targets
repo_name: kmp-targets
repo_url: https://github.com/rsicarelli/kmp-targets
site_url: https://rsicarelli.github.io/kmp-targets/
site_description: "Dynamically select which Kotlin Multiplatform targets to build via the kmptargets.targets Gradle property"
site_author: Rodrigo Sicarelli
remote_branch: gh-pages

copyright: 'Copyright &copy; 2026 Rodrigo Sicarelli'

theme:
  name: 'material'
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: 'Inter'
    code: 'Fira Code'
  features:
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - mike

# Material for MkDocs recommended set; codehilite/smarty/nl2br are
# incompatible with superfences-rendered fenced code — do not re-add them.
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

  # PyMdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: rsicarelli
      repo: kmp-targets
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

extra_css:
  - stylesheets/kmp-targets-brand.css

extra:
  version:
    provider: mike

nav:
  - 'Home': index.md
  - 'Get Started':
      - 'Installation': get-started/index.md
      - 'Quick Start': get-started/quick-start.md
  - 'User Guide':
      - 'Selection DSL': user-guide/selection-dsl.md
      - 'Selection Layers': user-guide/selection-layers.md
      - 'Targets Reference': user-guide/targets-reference.md
      - 'Hierarchy': user-guide/hierarchy-template.md
      - 'Build Logic': user-guide/build-logic.md
      - 'Apple Framework': user-guide/apple-framework.md
      - 'Recipes': user-guide/recipes.md
      - 'Advisories & Strict Mode': user-guide/advisories.md
      - 'Diagnostics': user-guide/diagnostics.md
      - 'ABI Validation': user-guide/abi-validation.md
      - 'CI': user-guide/ci-matrix.md
  - 'Samples': samples/index.md
  - 'Compatibility': compatibility.md
  - 'Design': why-kmp-targets.md
  - 'Help':
      - 'FAQ': help/faq.md
      - 'Troubleshooting': help/troubleshooting.md

version: '3'

vars:
  GRADLE: ./gradlew

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build all plugin modules (core + convention plugins)
    cmds:
      - "{{.GRADLE}} build"

  test:
    desc: Run all tests across modules (TestKit functional tests included)
    cmds:
      - "{{.GRADLE}} test"

  check:
    desc: Run all checks across modules (test + ktfmt)
    cmds:
      - "{{.GRADLE}} check"

  publish-local:
    desc: Publish the plugin (and its marker) to Maven Local for sample iteration
    cmds:
      - "{{.GRADLE}} publishToMavenLocal"

  sample:
    desc: Quick smoke — plugin applies and registers KMP targets (depends on publish-local)
    deps: [publish-local]
    cmds:
      - "{{.GRADLE}} -p samples/hello-world help"

  sample:build:
    desc: Build the hello-world sample (depends on publish-local)
    deps: [publish-local]
    cmds:
      - "{{.GRADLE}} -p samples/hello-world build"

  sample:isolated:
    desc: Build the isolated-projects sample with Gradle Isolated Projects enabled (depends on publish-local)
    deps: [publish-local]
    cmds:
      - "{{.GRADLE}} -p samples/isolated-projects build"

  sample:abi-bcv:
    desc: "ABI × selection blind spot (kotlinx BCV): doctor flags the uncovered dumps under a narrowed jvm lane (depends on publish-local)"
    deps: [publish-local]
    cmds:
      - "{{.GRADLE}} -p samples/abi-bcv kmpTargetsInfo kmpTargetsDoctor -Pkmptargets.targets=jvm"

  sample:abi-builtin:
    desc: "ABI × selection blind spot (built-in abiValidation): doctor flags the uncovered dumps under a narrowed jvm lane (depends on publish-local)"
    deps: [publish-local]
    cmds:
      - "{{.GRADLE}} -p samples/abi-builtin kmpTargetsInfo kmpTargetsDoctor -Pkmptargets.targets=jvm"

  ci:
    desc: Full local CI dry-run (check + publish-local + samples)
    cmds:
      - task: check
      - task: sample
      - task: sample:build
      - task: sample:isolated
      - task: sample:abi-bcv
      - task: sample:abi-builtin

  dod:
    desc: Definition of Done — fmt + build + test (run before committing)
    cmds:
      - task: fmt
      - task: build
      - task: test

  hooks:install:
    desc: Enable the version-controlled .githooks/ directory (pre-commit DOD gate)
    cmds:
      - git config core.hooksPath .githooks
      - echo "✓ git hooks enabled (.githooks/). Skip once with 'git commit --no-verify'."

  hooks:uninstall:
    desc: Restore Git's default .git/hooks/ directory
    cmds:
      - git config --unset core.hooksPath
      - echo "✓ git hooks disabled (back to .git/hooks/)."

  docs:serve:
    desc: Serve the docs site locally (needs `pip install -r .github/workflows/mkdocs-requirements.txt`)
    cmds:
      - mkdocs serve

  clean:
    desc: Clean root build + sample build artifacts
    cmds:
      - "{{.GRADLE}} clean"
      - rm -rf samples/hello-world/build samples/hello-world/.gradle
      - rm -rf samples/isolated-projects/build samples/isolated-projects/.gradle samples/isolated-projects/*/build
      - rm -rf samples/abi-bcv/build samples/abi-bcv/.gradle
      - rm -rf samples/abi-builtin/build samples/abi-builtin/.gradle

  fmt:
    desc: Format Kotlin sources with ktfmt (kotlinlang style) across the main build and both samples
    cmds:
      - "{{.GRADLE}} ktfmtFormat"
      - "{{.GRADLE}} -p samples/hello-world ktfmtFormat"
      - "{{.GRADLE}} -p samples/isolated-projects ktfmtFormat"
      - "{{.GRADLE}} -p samples/abi-bcv ktfmtFormat"
      - "{{.GRADLE}} -p samples/abi-builtin ktfmtFormat"

  fmt:check:
    desc: Verify Kotlin sources are ktfmt-formatted across the main build and both samples (run by `task check`)
    cmds:
      - "{{.GRADLE}} ktfmtCheck"
      - "{{.GRADLE}} -p samples/hello-world ktfmtCheck"
      - "{{.GRADLE}} -p samples/isolated-projects ktfmtCheck"
      - "{{.GRADLE}} -p samples/abi-bcv ktfmtCheck"
      - "{{.GRADLE}} -p samples/abi-builtin ktfmtCheck"
